
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 30px;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #2563eb;
        }

        footer {
            background-color: #1e40af;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>HTML & CSS Fundamentals</h1>
        <p>My First Website</p>
    </header>

    <main>
        <section>
            <h2>What is HTML?</h2>
            <p>HTML is used to create the structure of a web page.</p>
        </section>

        <section>
            <h2>What is CSS?</h2>
            <p>CSS is used to add colours, styles and layouts to a web page.</p>
        </section>
    <section>
    <h2>JavaScript Greeting</h2>
    <p>Enter your name:</p>

    <input type="text" id="username" placeholder="Your name">

    <button onclick="showGreeting()">Show Greeting</button>
    <button onclick="clearMessage()">Clear</button>

    <p id="message"></p>
</section>
    </main>

    <footer>
        <p>Created for my internship task</p>
    </footer>
<script>
    function showGreeting() {
        let name = document.getElementById("username").value;

        if (name.trim() === "") {
            document.getElementById("message").innerHTML =
                "Please enter your name!";
        } else {
            document.getElementById("message").innerHTML =
                "Hello, " + name + "! Welcome to JavaScript.";
        }
    }

    function clearMessage() {
        document.getElementById("username").value = "";
        document.getElementById("message").innerHTML = "";
    }
</script>
</body>

</html>
